<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F4B">
<title>DropAffy</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#0B1F4B;--blue:#1F4FFF;--sky:#E9EFFF;--bg:#F2F4F8;--line:#E1E6EF;--amber:#F5A400;--tx:#1B2540;--mut:#6B7593;--ok:#12A150;--bad:#D63A3A;--f1:'Bricolage Grotesque',system-ui,sans-serif;--f2:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:15px/1.5 var(--f2);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--blue);color:#fff;padding:.7rem 1.1rem;border-radius:12px;font-weight:600;transition:transform .1s,opacity .2s}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9DB4FF;outline-offset:1px}
button.ghost{background:var(--sky);color:var(--blue)}button.sm{padding:.4rem .8rem;font-size:13px;border-radius:9px}button.bad{background:#FDECEC;color:var(--bad)}
input,select,textarea{width:100%;font-size:16px;padding:.75rem .9rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-top:.35rem}
textarea{min-height:110px;resize:none}label{display:block;font-weight:600;font-size:13px;margin-top:.9rem}
#app{width:100%;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.1rem;padding-top:calc(.8rem + env(safe-area-inset-top,0px));background:var(--ink);color:#fff}
.logo{font:800 22px var(--f1);letter-spacing:-.5px}.logo i{font-style:normal;color:#8FB0FF}
.bell{background:#ffffff1f;padding:.45rem .7rem;position:relative}.bell em{position:absolute;top:-3px;right:-3px;background:var(--amber);color:var(--ink);font:700 11px var(--f2);min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-style:normal}
main{padding:1rem 1.1rem}h1,h2,h3{font-family:var(--f1);letter-spacing:-.3px;line-height:1.2}h2{font-size:24px;margin-bottom:.8rem}h3{font-size:17px;margin:.35rem 0}
.search{border-radius:14px;box-shadow:0 1px 0 var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E4E8F1;border-radius:12px;padding:4px;margin:.8rem 0}.seg button{background:none;color:var(--mut);padding:.55rem}.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0b1f4b22}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}.cta button{font-size:13px;padding:.65rem .4rem}
.stack{display:grid;gap:.8rem}
.card{background:#fff;border-radius:16px;padding:1rem;border-left:5px solid var(--blue)}.card.s{border-left-color:var(--amber)}
.card p{color:#46506D;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card footer{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}.card footer span{display:flex;gap:.4rem}
.who{display:flex;gap:.7rem;align-items:center;cursor:pointer}.who div{flex:1;min-width:0;display:grid}.who b{font-size:14px}small{color:var(--mut);font-size:12.5px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--blue);background:var(--sky);padding:.15rem .6rem;border-radius:99px;margin-top:.7rem}.card.s .tag{background:#FFF3D6;color:#8A5B00}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f1);flex:none}.av.lg{width:72px;height:72px;font-size:24px}
.empty{text-align:center;padding:2.5rem 1rem;background:#fff;border-radius:16px}.empty p{color:var(--mut)}.muted{color:var(--mut)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{background:none;color:var(--mut);border-radius:0;padding:.55rem 0;font-size:11.5px;display:grid;gap:0;justify-items:center}nav span{font-size:20px;line-height:1.1}nav .on{color:var(--blue)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.tile{background:#fff;border-radius:16px;padding:1rem}.tile b{font:800 30px var(--f1);color:var(--ink);display:block}.tile small{display:block}
.quota{background:var(--ink);color:#fff;border-radius:18px;padding:1.2rem;margin:.9rem 0}.quota b{font:800 34px var(--f1)}.bar{height:10px;background:#ffffff26;border-radius:9px;margin:.8rem 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber);border-radius:9px}
.row{display:flex;gap:.7rem;align-items:center;background:#fff;border-radius:14px;padding:.8rem;margin-bottom:.6rem}.row div{flex:1;min-width:0;display:grid}.row .acts{display:flex;gap:.4rem;flex:none}
h4{margin:1.2rem 0 .5rem;font-size:14px;color:var(--mut)}
.send{display:flex;gap:.5rem}.send input{margin:0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:30;display:none;max-width:90%;text-align:center}
.hero{background:var(--ink);color:#fff;padding:calc(2.2rem + env(safe-area-inset-top,0px)) 1.4rem 2rem;position:relative;overflow:hidden}
.hero h1{font-size:34px;font-weight:800;max-width:11em}.hero p{color:#B9C6EA;margin-top:.8rem;max-width:26em}
.mini{position:absolute;right:-18px;top:34px;width:150px;background:#fff;color:var(--tx);border-radius:12px;padding:.6rem;font-size:11px;border-left:4px solid var(--blue);transform:rotate(6deg);opacity:.95}.mini.b{top:112px;right:26px;border-left-color:var(--amber);transform:rotate(-4deg)}
.auth{padding:1.2rem 1.4rem}.auth .seg{margin-top:0}.err{color:var(--bad);font-size:13px;margin-top:.6rem}
@media(min-width:700px){#app,nav,.panel{max-width:560px}}.bell em[hidden]{display:none}@media(max-width:420px){.mini{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><div id="sheet" onclick="if(event.target==this)closeSheet()"></div><div id="toast" role="status"></div>
<script>
const sb=supabase.createClient('https://fodmqtpaxygjoimuvvaw.supabase.co','sb_publishable_17TCsv957eSSrQIg_8BwDg_q6jSFNkB');
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name=p=>(p&&`${p.first_name||''} ${p.last_name||''}`.trim())||'Membre';
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const av=(p,z='')=>{const n=name(p);return `<span class="av ${z}" style="background:hsl(${hue(n)} 60% 92%);color:hsl(${hue(n)} 55% 28%)">${esc(n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`};
const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<1?"à l'instant":m<60?`il y a ${m|0} min`:m<1440?`il y a ${m/60|0} h`:`il y a ${m/1440|0} j`};
const CATS=['Produits','Services','Prestations','Opportunités commerciales','Fournisseurs','Partenaires','Immobilier','Emploi','Transport et livraison','Autre'];
let me=null,view='home',kind='offers',q='',items=[],ch=null,authMode='in';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3600)}
function sheet(h){const s=$('#sheet');s.innerHTML=`<div class="panel">${h}</div>`;s.classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');if(ch){sb.removeChannel(ch);ch=null}}
function shell(inner){app.innerHTML=`<header><b class="logo">Drop<i>Affy</i></b><button class="bell" onclick="go('notifs')" aria-label="Notifications">🔔<em id="nb" hidden></em></button></header><main>${inner}</main><nav>${[['home','Accueil','⌂'],['new','Publier','＋'],['contacts','Contacts','☍'],['dash','Activité','▦'],['me','Profil','◔']].map(([k,l,i])=>`<button class="${view==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}</nav>`;badge()}
async function badge(){const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',me.id).eq('is_read',false);const b=$('#nb');if(b&&count){b.hidden=false;b.textContent=count}}
function go(v){view=v;scrollTo(0,0);V[v]()}
/* ---------- AUTH ---------- */
function authView(){const up=authMode=='up';app.innerHTML=`<section class="hero"><b class="logo">Drop<i>Affy</i></b><h1 style="margin-top:2.2rem">Vos publications créent vos opportunités.</h1><p>La communauté professionnelle des entrepreneurs, fournisseurs et prestataires d'Afrique de l'Ouest.</p><div class="mini"><b>Cherche fournisseur de riz</b><br>Ouagadougou</div><div class="mini b"><b>Offre : onduleurs solaires</b><br>Bobo-Dioulasso</div></section>
<section class="auth"><div class="seg" style="margin-top:1.2rem"><button class="${up?'':'on'}" onclick="authMode='in';authView()">Connexion</button><button class="${up?'on':''}" onclick="authMode='up';authView()">Créer un compte</button></div>
${up?`<label>Prénom<input id="fn" autocomplete="given-name"></label><label>Nom<input id="ln" autocomplete="family-name"></label>`:''}
<label>Adresse e-mail<input id="em" type="email" autocomplete="email"></label><label>Mot de passe<input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}"></label>
<p class="err" id="er"></p><button style="width:100%;margin-top:1rem" onclick="doAuth()">${up?'Créer mon compte':'Me connecter'}</button><p class="muted" style="margin-top:.8rem;text-align:center"><small>Inscription et consultation gratuites.</small></p></section>`}
async function doAuth(){const em=$('#em').value.trim(),pw=$('#pw').value,er=$('#er');er.textContent='';
let r;if(authMode=='up'){r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname,data:{first_name:$('#fn').value.trim(),last_name:$('#ln').value.trim()}}});if(!r.error&&!r.data.session){er.style.color='var(--ok)';er.textContent='Compte créé. Confirmez votre e-mail puis connectez-vous.';return}}
else r=await sb.auth.signInWithPassword({email:em,password:pw});
if(r.error)er.textContent=r.error.message.includes('Invalid')?'E-mail ou mot de passe incorrect.':r.error.message}
/* ---------- VIEWS ---------- */
const V={};
V.home=async()=>{shell(`<input id="q" class="search" placeholder="Rechercher une offre ou un besoin" value="${esc(q)}" oninput="q=this.value;list()"><div class="seg"><button class="${kind=='offers'?'on':''}" onclick="kind='offers';V.home()">Offres</button><button class="${kind=='searches'?'on':''}" onclick="kind='searches';V.home()">Recherches</button></div><div class="cta"><button onclick="go('new')">Publier une offre</button><button class="ghost" onclick="go('new')">Publier une recherche</button></div><div id="list" class="stack"><p class="muted">Chargement…</p></div>`);
const{data}=await sb.from(kind).select('*,profiles(id,first_name,last_name,profession,city)').eq('status','active').order('created_at',{ascending:false}).limit(60);items=data||[];list()};
function list(){const t=q.toLowerCase(),r=items.filter(i=>(i.title+i.description+i.category).toLowerCase().includes(t));$('#list').innerHTML=r.length?r.map(card).join(''):`<div class="empty"><b>Rien pour l'instant</b><p>Soyez le premier à publier ${kind=='offers'?'une offre':'une recherche'}.</p></div>`}
const st={pending:'Demande en attente',accepted:'Contact accepté',declined:'Demande refusée'};
sheet(`<div style="display:flex;gap:1rem;align-items:center">${av(p,'lg')}<div><h2 style="margin:0;font-size:21px">${esc(name(p))}</h2><small>${esc(p.profession||'')}${p.company?' chez '+esc(p.company):''}${p.city?'<br>📍 '+esc(p.city):''}</small></div></div>
${p.bio?`<p style="margin-top:1rem">${esc(p.bio)}</p>`:''}${(p.activities||[]).length?`<p style="margin-top:.7rem">${p.activities.map(a=>`<span class="tag" style="margin:0 .3rem .3rem 0">${esc(a)}</span>`).join('')}</p>`:''}
<h4>Publications</h4>${[...(of||[]).map(x=>'Offre : '+x.title),...(se||[]).map(x=>'Recherche : '+x.title)].map(t=>`<div class="row">${esc(t)}</div>`).join('')||'<p class="muted">Aucune publication active.</p>'}
${id==me.id?'':cr?`<button class="ghost" style="width:100%" disabled>${st[cr.status]}</button>`:`<button style="width:100%;margin-top:.8rem" onclick="reqContact('${id}','${ctx||''}')">Demander un contact</button>`}`)}
async function reqContact(id,ctx){const o=kind=='offers';const{error}=await sb.from('contact_requests').insert({sender_id:me.id,receiver_id:id,offer_id:ctx&&o?ctx:null,search_id:ctx&&!o?ctx:null});closeSheet();
toast(!error?'Demande envoyée.':error.code=='23505'?'Demande déjà envoyée.':error.code=='42501'?'Quota atteint : payez 100 FCFA dans Activité pour débloquer 5 mises en contact.':'Envoi impossible.')}
V.new=()=>{shell(`<h2>Publier</h2><div class="seg"><button id="k1" class="on" onclick="pk('offers')">Une offre</button><button id="k2" onclick="pk('searches')">Une recherche</button></div>
<label>Titre<input id="t" maxlength="150" placeholder="Ex. Fournisseur de panneaux solaires"></label><label>Catégorie<select id="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Localisation<input id="l" placeholder="Ville, pays"></label><label>Description<textarea id="d" placeholder="Décrivez précisément votre offre ou votre besoin"></textarea></label><p class="err" id="er"></p><button style="width:100%;margin-top:1rem" onclick="publish()">Publier</button>`)}
let pkind='offers';function pk(k){pkind=k;$('#k1').className=k=='offers'?'on':'';$('#k2').className=k=='searches'?'on':''}
async function publish(){const t=$('#t').value.trim(),d=$('#d').value.trim();if(t.length<3||!d){$('#er').textContent='Ajoutez un titre et une description.';return}
const{error}=await sb.from(pkind).insert({author_id:me.id,title:t,description:d,category:$('#c').value,location:$('#l').value.trim()||null});if(error){$('#er').textContent='Publication impossible. Réessayez.';return}toast('Publié.');kind=pkind;go('home')}
V.contacts=async()=>{shell('<h2>Mes contacts</h2><p class="muted">Chargement…</p>');
const{data}=await sb.from('contact_requests').select('*,sender:profiles!contact_requests_sender_id_fkey(id,first_name,last_name,profession),receiver:profiles!contact_requests_receiver_id_fkey(id,first_name,last_name,profession)').order('created_at',{ascending:false});const d=data||[];
const row=(p,sub,acts)=>`<div class="row">${av(p)}<div><b>${esc(name(p))}</b><small>${esc(sub||'')}</small></div><span class="acts">${acts||''}</span></div>`;
const rec=d.filter(r=>r.status=='pending'&&r.receiver_id==me.id),sent=d.filter(r=>r.status=='pending'&&r.sender_id==me.id),acc=d.filter(r=>r.status=='accepted');
$('main').innerHTML=`<h2>Mes contacts</h2><h4>Demandes reçues (${rec.length})</h4>${rec.map(r=>row(r.sender,r.sender.profession,`<button class="sm" onclick="resp('${r.id}',true)">Accepter</button><button class="sm bad" onclick="resp('${r.id}',false)">Refuser</button>`)).join('')||'<p class="muted">Aucune demande.</p>'}
<h4>Demandes envoyées (${sent.length})</h4>${sent.map(r=>row(r.receiver,'En attente de réponse')).join('')||'<p class="muted">Aucune demande en attente.</p>'}
<h4>Contacts acceptés (${acc.length})</h4>${acc.map(r=>{const o=r.sender_id==me.id?r.receiver:r.sender;return row(o,o.profession,`<button class="sm ghost" onclick="chat('${o.id}')">Discuter</button>`)}).join('')||'<p class="muted">Vos contacts acceptés apparaîtront ici.</p>'}`}
async function resp(id,a){const{error}=await sb.rpc('respond_contact_request',{p_request_id:id,p_accept:a});if(error)toast(error.message.includes('quota_exhausted')?"Ce membre a épuisé son quota de mises en contact.":'Action impossible.');else toast(a?'Contact accepté.':'Demande refusée.');V.contacts()}
async function chat(other){let{data:c}=await sb.from('conversations').select('id').or(`and(user_a.eq.${me.id},user_b.eq.${other}),and(user_a.eq.${other},user_b.eq.${me.id})`).order('created_at').limit(1);let id=c&&c[0]?.id;
if(!id){const r=await sb.rpc('start_conversation',{p_other:other});if(r.error){toast('Discussion impossible.');return}id=r.data}
const{data:ms}=await sb.from('messages').select('*').eq('conversation_id',id).order('created_at');
sheet(`<h2 style="font-size:20px">Discussion</h2><div class="msgs" id="ms"></div><div class="send"><input id="mi" placeholder="Votre message" onkeydown="if(event.key=='Enter')sendMsg('${id}')"><button onclick="sendMsg('${id}')">Envoyer</button></div>`);
const add=m=>{if(document.getElementById('m'+m.id))return;$('#ms').insertAdjacentHTML('beforeend',`<div id="m${m.id}" class="m ${m.sender_id==me.id?'me':''}">${esc(m.body)}</div>`);$('#ms').scrollTop=1e9};(ms||[]).forEach(add);
ch=sb.channel('c'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},p=>add(p.new)).subscribe();window._add=add}
async function sendMsg(id){const i=$('#mi'),b=i.value.trim();if(!b)return;i.value='';const{data,error}=await sb.from('messages').insert({conversation_id:id,sender_id:me.id,body:b}).select().single();if(error)toast('Message non envoyé.');else window._add(data)}
V.dash=async()=>{shell('<h2>Mon activité</h2><p class="muted">Chargement…</p>');
let[{data:s},{data:pay}]=await Promise.all([sb.rpc('get_my_stats'),sb.from('payments').select('*').order('created_at',{ascending:false}).limit(8)]);s=s||{};const left=(s.quota_allowed||5)-(s.quota_used||0),pc=Math.min(100,100*(s.quota_used||0)/(s.quota_allowed||5));
const T=[['profile_views','Visites du profil'],['accepted_contacts','Contacts acceptés'],['offers','Offres publiées'],['searches','Recherches publiées'],['interests_received','Intérêts reçus'],['active_conversations','Discussions actives']];
$('main').innerHTML=`<h2>Mon activité</h2><div class="quota"><small style="color:#B9C6EA">Mises en contact restantes</small><br><b>${left}</b><div class="bar"><i style="width:${pc}%"></i></div><small style="color:#B9C6EA">${s.quota_used||0} utilisées sur ${s.quota_allowed||5}. Après chaque tranche de 5 contacts acceptés, 100 FCFA débloquent 5 nouvelles mises en contact.</small><button style="width:100%;margin-top:.9rem;background:var(--amber);color:var(--ink)" onclick="pay()">Débloquer 5 contacts : 100 FCFA</button></div>
<div class="tiles">${T.map(([k,l])=>`<div class="tile"><b>${s[k]||0}</b><small>${l}</small></div>`).join('')}</div><h4>Historique des paiements</h4>${(pay||[]).map(p=>`<div class="row"><div><b>${p.amount} FCFA</b><small>${ago(p.created_at)}</small></div><small>${{pending:'En attente',confirmed:'Confirmé',failed:'Échoué'}[p.status]}</small></div>`).join('')||'<p class="muted">Aucun paiement.</p>'}`}
async function pay(){const{error}=await sb.from('payments').insert({user_id:me.id});toast(error?'Demande impossible.':'Paiement créé. Il sera confirmé dès réception.');V.dash()}
V.me=async()=>{const{data:p}=await sb.from('profiles').select('*').eq('id',me.id).single();const f=(k,l,t='input')=>`<label>${l}${t=='ta'?`<textarea id="p_${k}">${esc(p[k])}</textarea>`:`<input id="p_${k}" value="${esc(p[k])}">`}</label>`;
shell(`<h2>Mon profil</h2><div style="display:flex;gap:1rem;align-items:center">${av(p,'lg')}<small>${esc(me.email)}</small></div>${f('first_name','Prénom')}${f('last_name','Nom')}${f('profession','Profession ou activité')}${f('company','Entreprise (facultatif)')}${f('city','Ville')}${f('bio','Présentation professionnelle','ta')}<label>Domaines d'activité (séparés par des virgules)<input id="p_act" value="${esc((p.activities||[]).join(', '))}"></label>
<button style="width:100%;margin-top:1.2rem" onclick="saveP()">Enregistrer</button><button class="ghost" style="width:100%;margin-top:.6rem" onclick="sb.auth.signOut()">Se déconnecter</button>`)}
async function saveP(){const g=k=>$('#p_'+k).value.trim();const{error}=await sb.from('profiles').update({first_name:g('first_name'),last_name:g('last_name'),profession:g('profession')||null,company:g('company')||null,city:g('city')||null,bio:g('bio')||null,activities:$('#p_act').value.split(',').map(x=>x.trim()).filter(Boolean)}).eq('id',me.id);toast(error?'Enregistrement impossible.':'Profil enregistré.')}
V.notifs=async()=>{shell('<h2>Notifications</h2><p class="muted">Chargement…</p>');const{data}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(40);
$('main').innerHTML=`<h2>Notifications</h2>${(data||[]).map(n=>`<div class="row" style="${n.is_read?'':'border-left:4px solid var(--blue)'}"><div><b>${esc(n.title)}</b><small>${esc(n.body||'')} · ${ago(n.created_at)}</small></div></div>`).join('')||'<div class="empty"><b>Aucune notification</b></div>'}`;
await sb.from('notifications').update({is_read:true}).eq('user_id',me.id).eq('is_read',false);const b=$('#nb');if(b)b.hidden=true}
/* ---------- BOOT ---------- */
sb.auth.onAuthStateChange((_e,s)=>{const u=s?.user||null;if((u&&u.id)!==(me&&me.id)){me=u;me?go('home'):authView()}});
