<style>

body{font:16px/1.55 var(--f2);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--blue);color:#fff;min-height:46px;padding:.6rem 1.2rem;border-radius:13px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;transition:transform .1s,opacity .2s}

main{padding:1.1rem 1.1rem}h1,h2,h3{font-family:var(--f1);letter-spacing:-.3px;line-height:1.2}h2{font-size:28px;margin-bottom:.9rem}h3{font-size:20px;margin:.45rem 0}

.card p{color:#3E4864;font-size:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card footer{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}.card footer span{display:flex;gap:.5rem;flex-wrap:wrap}
.who{display:flex;gap:.8rem;align-items:center;cursor:pointer}.who div{flex:1;min-width:0;display:grid}.who b{font-size:17px}small{color:var(--mut);font-size:14px}

.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--f1);flex:none}.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.av.lg{width:76px;height:76px;font-size:26px}
.empty{text-align:center;padding:2.5rem 1rem;background:#fff;border-radius:18px}.empty p{color:var(--mut)}.muted{color:var(--mut)}
.sk{height:170px;border-radius:18px;background:linear-gradient(90deg,#E8ECF4,#F6F8FC,#E8ECF4);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.tile{background:#fff;border-radius:18px;padding:1.1rem}.tile svg{color:var(--blue)}.tile b{font:800 32px var(--f1);color:var(--ink);display:block}

.row{display:flex;gap:.8rem;align-items:center;background:#fff;border-radius:16px;padding:.9rem;margin-bottom:.7rem}.row.c{cursor:pointer}.row.u{border-left:4px solid var(--blue)}.row>div{flex:1;min-width:0;display:grid}.row .acts{display:flex;gap:.5rem;flex:none}.row b{font-size:17px}
h4{margin:1.3rem 0 .6rem;font-size:15px;color:var(--mut)}
#sheet{position:fixed;inset:0;background:#0b1f4b8c;z-index:20;display:none;align-items:flex-end;justify-content:center}#sheet.on{display:flex}
.panel{background:#fff;width:100%;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:1.4rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
.msgs{display:grid;gap:.5rem;max-height:46vh;overflow:auto;margin:.8rem 0}.m{max-width:82%;padding:.55rem .9rem;border-radius:16px;background:var(--bg);font-size:16px}.m small{display:block;opacity:.7}.m.me{justify-self:end;background:var(--blue);color:#fff}
.send{display:flex;gap:.5rem}.send input{margin:0}.send button{width:52px;padding:0}
#toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.8rem 1.2rem;border-radius:13px;z-index:30;display:none;max-width:90%;text-align:center}
.hero{background:var(--ink);color:#fff;padding:calc(2.2rem + env(safe-area-inset-top,0px)) 1.4rem 2rem;position:relative;overflow:hidden}
.hero h1{font-size:30px;font-weight:800;max-width:11em}.hero p{color:#B9C6EA;margin-top:.8rem;max-width:26em;font-size:17px}
.mini{position:absolute;right:-18px;top:34px;width:150px;background:#fff;color:var(--tx);border-radius:12px;padding:.6rem;font-size:14px;border-left:4px solid var(--blue);transform:rotate(6deg);opacity:.95}.mini.b{top:116px;right:26px;border-left-color:var(--amber);transform:rotate(-4deg)}
.auth{padding:1.2rem 1.4rem;max-width:520px;margin:0 auto}.err{color:var(--bad);font-size:15px;margin-top:.7rem}
.st.pending{background:#FFF3D6;color:#8A5B00}.st.rejected{background:#FDECEC;color:var(--bad)}
.imgs{display:flex;gap:.5rem;overflow-x:auto;margin-top:.8rem}.imgs img{height:170px;max-width:85%;border-radius:13px;flex:none;object-fit:cover}
.th{position:relative;flex:none}.th img{height:110px;width:110px}.th button{position:absolute;top:4px;right:4px;min-height:32px;width:32px;padding:0;border-radius:50%;background:#0b1f4bcc}
.imgs .addimg{margin:0;display:grid;place-items:center;align-content:center;gap:.2rem;width:110px;height:110px;flex:none;border:2px dashed #B9C6EA;border-radius:13px;color:var(--blue);font-size:14px;text-align:center;cursor:pointer}
@media(min-width:700px){.panel{max-width:620px;border-radius:24px;margin-bottom:5vh}#sheet{align-items:center}.panel{margin:0}}
@media(min-width:900px){#app,nav{max-width:1000px}main{padding:1.6rem 2rem}.stack{grid-template-columns:1fr 1fr;align-items:start}.tiles{grid-template-columns:repeat(3,1fr)}.hero{padding-left:3rem}.hero h1{font-size:40px}}
@media(max-width:420px){.mini{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const sb=supabase.createClient('https://fodmqtpaxygjoimuvvaw.supabase.co','sb_publishable_17TCsv957eSSrQIg_8BwDg_q6jSFNkB');
const $=s=>document.querySelector(s),app=$('#app'),PS=12,loc=()=>location.origin+location.pathname;

const SK='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';

const errFr=e=>{const m=(e?.message||'').toLowerCase();return m.includes('invalid login')?'E-mail ou mot de passe incorrect.':m.includes('not confirmed')?"Confirmez d'abord votre adresse e-mail.":m.includes('already registered')?'Un compte existe déjà avec cet e-mail.':m.includes('at least')?'Mot de passe trop court (6 caractères minimum).':m.includes('rate')||m.includes('seconds')?'Trop de tentatives. Réessayez dans quelques minutes.':m.includes('valid email')||m.includes('invalid format')?'Adresse e-mail invalide.':m.includes('fetch')||m.includes('network')?'Connexion Internet instable. Réessayez.':'Une erreur est survenue. Réessayez.'};
let nch=null,adm=false,pim=[],me=null,view='home',kind='offers',q='',items=[],page=0,more=false,mine=new Set(),ch=null,authMode='in',dtab='over',rec=0,tm,lt;
new MutationObserver(()=>{clearTimeout(lt);lt=setTimeout(()=>window.lucide&&lucide.createIcons(),0)}).observe(document.body,{childList:true,subtree:true});
async function once(b,f){if(b.disabled)return;b.disabled=true;try{await f()}finally{b.disabled=false}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3800)}
function sheet(h){const s=$('#sheet');s.innerHTML=`<div class="panel">${h}</div>`;s.classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');if(ch){sb.removeChannel(ch);ch=null}}
function shell(inner){app.innerHTML=`<header><b class="logo">Drop<i>Affy</i></b><button class="bell" onclick="go('notifs')" aria-label="Notifications">${ic('bell')}<em id="nb" hidden></em></button></header><main>${inner}</main><nav>${[['home','Accueil','house'],['new','Publier','plus'],['contacts','Contacts','users'],['dash','Activité','layout-dashboard'],['me','Profil','user']].map(([k,l,i])=>`<button class="${view==k?'on':''} ${k=='new'?'pub':''}" onclick="go('${k}')"><span>${ic(i)}</span>${l}</button>`).join('')}</nav>`;badge()}
async function badge(){const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',me.id).eq('is_read',false);const b=$('#nb');if(b&&count){b.hidden=false;b.textContent=count>99?'99+':count}}

const al=(q,a)=>q=='supply'&&a=='yes'?'Oui, intéressé':q=='price'&&a=='no'?'Non, prix ferme':q=='details'&&a=='contact'?'Je précise en mise en contact':AB[a];
const imgs=a=>a&&a.length?`<div class="imgs">${a.map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div>`:'';
const ibHtml=()=>`<div class="imgs">${pim.map((x,i)=>`<div class="th"><img src="${esc(x.u)}" alt=""><button type="button" onclick="rmImg(${i})" aria-label="Retirer">${ic('x')}</button></div>`).join('')}${pim.length<3?`<label class="addimg">${ic('image-plus')}Ajouter<input type="file" accept="image/*" multiple hidden onchange="addImgs(this)"></label>`:''}</div>`;
function addImgs(i){[...i.files].forEach(f=>{if(pim.length<3&&f.size<15e6)pim.push({u:URL.createObjectURL(f),f})});i.value='';$('#ib').innerHTML=ibHtml()}
function rmImg(i){pim.splice(i,1);$('#ib').innerHTML=ibHtml()}
async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,1200/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
async function upImgs(){const out=[];for(const x of pim){if(!x.f){out.push(x.u);continue}let b=x.f;try{b=await shrink(x.f)}catch(e){}const path=`${me.id}/${Date.now()}-${out.length}.jpg`;const{error}=await sb.storage.from('offer-images').upload(path,b,{contentType:b.type||'image/jpeg'});if(error){toast("Envoi d'une image impossible. Réessayez.");return null}out.push(sb.storage.from('offer-images').getPublicUrl(path).data.publicUrl)}return out}

function authView(){rec=0;const up=authMode=='up',fg=authMode=='fg';app.innerHTML=`<section class="hero"><b class="logo">Drop<i>Affy</i></b><h1 style="margin-top:2rem">Vos publications créent vos opportunités.</h1><p>La communauté professionnelle des entrepreneurs, fournisseurs et prestataires d'Afrique de l'Ouest.</p><div class="mini"><b>Cherche fournisseur de riz</b><br>Ouagadougou</div><div class="mini b"><b>Offre : onduleurs solaires</b><br>Bobo-Dioulasso</div></section>
<section class="auth">${fg?'<h2 style="margin-top:.5rem">Mot de passe oublié</h2><p class="muted">Nous vous envoyons un lien pour choisir un nouveau mot de passe.</p>':`<div class="seg" style="margin-top:.5rem"><button class="${up?'':'on'}" onclick="authMode='in';authView()">Connexion</button><button class="${up?'on':''}" onclick="authMode='up';authView()">Créer un compte</button></div>`}
${up?`<label>Prénom<input id="fn" autocomplete="given-name"></label><label>Nom<input id="ln" autocomplete="family-name"></label>`:''}
<label>Adresse e-mail<input id="em" type="email" autocomplete="email" inputmode="email"></label>${fg?'':`<label>Mot de passe<input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}"></label>`}
<p class="err" id="er"></p><button style="width:100%;margin-top:1rem" onclick="once(this,doAuth)">${fg?'Envoyer le lien':up?'Créer mon compte':'Me connecter'}</button>
<p style="text-align:center;margin-top:1.1rem">${authMode=='in'?`<a href="#" onclick="authMode='fg';authView();return false">Mot de passe oublié ?</a>`:fg?`<a href="#" onclick="authMode='in';authView();return false">Retour à la connexion</a>`:''}</p><p class="muted" style="margin-top:.6rem;text-align:center"><small>Inscription et consultation gratuites.</small></p></section>`}
const ok=(e,t)=>{e.style.color='var(--ok)';e.textContent=t};
async function doAuth(){const em=$('#em').value.trim(),pw=$('#pw')?.value||'',er=$('#er');er.style.color='';er.textContent='';let r;
if(!em){er.textContent='Saisissez votre adresse e-mail.';return}
if(authMode=='fg'){r=await sb.auth.resetPasswordForEmail(em,{redirectTo:loc()});r.error?er.textContent=errFr(r.error):ok(er,'Lien envoyé. Consultez votre boîte e-mail.');return}

if(authMode=='up'){const fn=$('#fn').value.trim();if(!fn){er.textContent='Saisissez votre prénom.';return}
r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:loc(),data:{first_name:fn,last_name:$('#ln').value.trim()}}});if(!r.error&&!r.data.session){ok(er,'Compte créé. Confirmez votre e-mail puis connectez-vous.');return}}

if(r.error)er.textContent=errFr(r.error)}
function recView(){app.innerHTML=`<section class="auth" style="padding-top:3rem"><b class="logo" style="color:var(--ink)">Drop<i>Affy</i></b><h2 style="margin-top:1.5rem">Nouveau mot de passe</h2><label>Nouveau mot de passe<input id="pw" type="password" autocomplete="new-password"></label><p class="err" id="er"></p><button style="width:100%;margin-top:1rem" onclick="once(this,setPw)">Enregistrer</button></section>`}

const{data,error}=await r;if(error||!data){f.innerHTML=`<div class="empty" style="grid-column:1/-1"><b>Chargement impossible</b><p>Vérifiez votre connexion Internet.</p><button style="margin-top:1rem" onclick="load()">Réessayer</button></div>`;return}

async function saveP(){const g=k=>$('#p_'+k).value.trim(),num=id=>$(id).value.replace(/[\s.\-()]/g,''),wa_=num('#p_wa'),om=num('#p_om'),re=/^\+?[0-9]{8,15}$/;
if((wa_&&!re.test(wa_))||(om&&!re.test(om))){toast('Numéro invalide. Exemple : +22670000000');return}
const{error}=await sb.from('profiles').update({first_name:g('first_name'),last_name:g('last_name'),profession:g('profession')||null,company:g('company')||null,city:g('city')||null,bio:g('bio')||null,activities:$('#p_act').value.split(',').map(x=>x.trim()).filter(Boolean)}).eq('id',me.id);
const{error:e2}=await sb.from('profile_private').upsert({user_id:me.id,whatsapp:wa_||null,orange_money:om||null,updated_at:new Date().toISOString()});toast(error||e2?'Enregistrement impossible.':'Profil enregistré.')}
/* ---------- NOTIFICATIONS ---------- */
const NI={interest:'heart',contact_request:'user-plus',contact_accepted:'user-check',contact_declined:'user-x',message:'message-circle',payment:'wallet',quota:'wallet',exchange_q:'messages-square',exchange_a:'messages-square',pub_approved:'badge-check',pub_rejected:'circle-x'};
V.notifs=async()=>{shell(`<h2>Notifications</h2>${SK}`);const{data,error}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(40);
if(error){$('main').innerHTML='<h2>Notifications</h2><div class="empty"><b>Chargement impossible</b></div>';return}
$('main').innerHTML=`<h2>Notifications</h2>${pushCard()}${(data||[]).map(n=>`<div class="row c ${n.is_read?'':'u'}" onclick="openN('${n.type}','${n.link_id||''}')">${ic(NI[n.type]||'bell')}<div><b>${esc(n.title)}</b><small>${esc(n.body||'')} · ${ago(n.created_at)}</small></div></div>`).join('')||'<div class="empty"><b>Aucune notification</b></div>'}`;
await sb.from('notifications').update({is_read:true}).eq('user_id',me.id).eq('is_read',false);const b=$('#nb');if(b)b.hidden=true}
function pushCard(){if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window))return '';const p=Notification.permission;return `<div class="row" style="background:var(--sky);flex-wrap:wrap">${ic('bell-ring')}<div><b>Notifications sur ce téléphone</b><small>${p=='granted'?'Activées. Vous êtes prévenu même quand DropAffy est fermé.':p=='denied'?'Bloquées. Autorisez-les dans les réglages du navigateur.':'Recevez les alertes même quand DropAffy est fermé.'}</small></div>${p=='denied'?'':`<span class="acts"><button class="sm" onclick="once(this,pushOn)">${p=='granted'?'Réactiver':'Activer'}</button>${p=='granted'?`<button class="sm ghost" onclick="once(this,pushOff)">Désactiver</button><button class="sm ghost" onclick="once(this,pushTest)">Tester</button>`:''}</span>`}</div>`}
async function pushOn(){try{const m=await import('./push.js'),r=await m.enablePush(sb);toast(r.ok?'Notifications activées sur ce téléphone.':r.reason=='denied'?'Notifications refusées. Autorisez-les dans les réglages du navigateur.':r.reason=='unsupported'?'Ce navigateur ne prend pas en charge les notifications.':'Activation impossible. Réessayez.')}catch(e){toast('Activation impossible. Réessayez.')}V.notifs()}
async function pushTest(){const{error}=await sb.rpc('send_test_push');toast(error?(error.message.includes('Patientez')?'Patientez quelques secondes.':'Test impossible.'):'Test envoyé. La notification arrive dans quelques secondes.')}
async function pushOff(){try{const m=await import('./push.js');await m.disablePush(sb);toast('Notifications désactivées sur ce téléphone.')}catch(e){toast('Désactivation impossible.')}V.notifs()}
async function exInfo(id){const{data:x}=await sb.from('publication_exchanges').select('offer_id,search_id').eq('id',id).single();return x&&{k:x.offer_id?'offers':'searches',p:x.offer_id||x.search_id}}
async function openN(t,id){if(t=='contact_request'||t=='contact_declined')go('contacts');else if((t=='message'||t=='contact_accepted')&&id)chatConv(id);else if(t=='interest'||t=='pub_approved'||t=='pub_rejected'){dtab='pubs';go('dash')}else if(t=='payment'||t=='quota'){dtab='wal';go('dash')}else if((t=='exchange_q'||t=='exchange_a')&&id){const e=await exInfo(id);if(e)t=='exchange_q'?answers(e.k,e.p):pubSheet(e.k,e.p)}}
/* ---------- INTERACTIONS PRÉÉTABLIES ---------- */
async function pubSheet(k,id){const{data:p}=await sb.from(k).select('*,profiles(id,first_name,last_name,profession,city,avatar_url)').eq('id',id).single();if(!p){toast('Publication indisponible.');return}kind=k;const own=p.author_id==me.id,col=k=='offers'?'offer_id':'search_id';
const[{data:ex},{data:cr}]=await Promise.all([sb.from('publication_exchanges').select('*').eq(col,id).eq('asker_id',me.id),sb.from('contact_requests').select('status').or(`and(sender_id.eq.${me.id},receiver_id.eq.${p.author_id}),and(sender_id.eq.${p.author_id},receiver_id.eq.${me.id})`).limit(1)]);
const done=Object.fromEntries((ex||[]).map(x=>[x.question,x])),c=cr&&cr[0],st={pending:'Demande en attente',accepted:'Contact accepté',declined:'Demande refusée'};
sheet(`<div class="who" onclick="prof('${p.author_id}','${id}')">${av(p.profiles)}<div><b>${esc(name(p.profiles))}</b><small>${esc(p.profiles.profession||'')}${p.profiles.city?' · '+esc(p.profiles.city):''}</small></div></div><span class="tag">${k=='offers'?'Offre':'Recherche'} · ${esc(p.category)}</span>${imgs(p.images)}<h2 style="font-size:24px;margin:.6rem 0">${esc(p.title)}</h2><p>${esc(p.description)}</p>${p.location?`<small>${esc(p.location)}</small>`:''}
${own?'<h4>Votre publication</h4><p class="muted">Les questions reçues sont dans Activité, Publications.</p>':`<h4>Interagir</h4>${(k=='offers'?['price','commission']:['supply','details']).map(q=>{const x=done[q];return x?`<div class="row"><div><b>${Q[q]}</b><small>${x.answer?'Réponse : '+al(q,x.answer):'En attente de réponse'}</small></div></div>`:`<button class="ghost" style="width:100%;margin-bottom:.6rem" onclick="once(this,()=>ask('${k}','${id}','${q}'))">${Q[q]}</button>`}).join('')}${c?`<button class="ghost" style="width:100%" disabled>${st[c.status]}</button>`:`<button style="width:100%" onclick="once(this,()=>reqContact('${p.author_id}','${id}'))">${ic('user-plus')}Je demande une mise en contact</button>`}`}`)}
async function ask(k,id,q){const{error}=await sb.rpc('ask_exchange',{p_kind:k,p_pub:id,p_q:q});if(error){toast(error.message.includes('already_asked')?'Question déjà posée.':'Envoi impossible. Réessayez.');return}toast("Question envoyée à l'auteur.");pubSheet(k,id)}
async function answers(k,id){const{data,error}=await sb.from('publication_exchanges').select('*,asker:profiles!publication_exchanges_asker_id_fkey(id,first_name,last_name,profession,avatar_url)').eq(k=='offers'?'offer_id':'search_id',id).order('created_at',{ascending:false});
sheet(`<h2 style="font-size:22px">Questions reçues</h2>${error?'<p class="muted">Chargement impossible.</p>':(data||[]).map(x=>`<div class="card" style="margin-bottom:.8rem"><div class="who" onclick="kind='${k}';prof('${x.asker.id}','${id}')">${av(x.asker)}<div><b>${esc(name(x.asker))}</b><small>${esc(x.asker.profession||'')} · ${ago(x.created_at)}</small></div></div><h3 style="font-size:18px">${Q[x.question]}</h3>${x.answer?`<p><b>Votre réponse :</b> ${al(x.question,x.answer)}</p>`:`<div style="display:grid;gap:.5rem;margin-top:.6rem">${AO[x.question].map(a=>`<button class="ghost" onclick="once(this,()=>ans('${x.id}','${a}','${k}','${id}'))">${al(x.question,a)}</button>`).join('')}</div>`}</div>`).join('')||'<p class="muted">Aucune question pour le moment.</p>'}`)}
async function ans(id,a,k,pid){const{error}=await sb.rpc('answer_exchange',{p_id:id,p_a:a});toast(error?'Réponse impossible.':'Réponse envoyée.');answers(k,pid)}
async function wa(id){const{data}=await sb.rpc('get_whatsapp',{p_user:id});if(!data){toast("Ce contact n'a pas renseigné de WhatsApp.");return}open('https://wa.me/'+data.replace(/\D/g,''),'_blank')}
/* ---------- VALIDATION ADMIN ---------- */
async function valid(){const sel='*,profiles(id,first_name,last_name,profession,city,avatar_url)';const[{data:o},{data:s},{data:py}]=await Promise.all([sb.from('offers').select(sel).eq('status','pending'),sb.from('searches').select(sel).eq('status','pending'),sb.from('payments').select('*,profiles(id,first_name,last_name,avatar_url)').eq('status','pending').order('created_at')]);
const ids=(py||[]).map(p=>p.user_id);const{data:pv}=ids.length?await sb.from('profile_private').select('user_id,orange_money').in('user_id',ids):{data:[]};const om=Object.fromEntries((pv||[]).map(x=>[x.user_id,x.orange_money]));
const all=[...(o||[]).map(x=>[x,'offers']),...(s||[]).map(x=>[x,'searches'])];
$('#dc').innerHTML=`<h4>Paiements à confirmer (${(py||[]).length})</h4>${(py||[]).map(p=>`<div class="row">${av(p.profiles)}<div><b>${esc(name(p.profiles))} · ${p.amount} FCFA</b><small>Réf. : ${esc(p.reference||'non indiquée')}${om[p.user_id]?' · Orange Money '+esc(om[p.user_id]):''}</small></div><span class="acts"><button class="sm" onclick="once(this,()=>payAct('${p.id}',1))" aria-label="Confirmer">${ic('check')}</button><button class="sm bad" onclick="once(this,()=>payAct('${p.id}',0))" aria-label="Rejeter">${ic('x')}</button></span></div>`).join('')||'<p class="muted">Aucun paiement en attente.</p>'}
<h4>Publications à valider (${all.length})</h4>${all.length?`<div class="stack">${all.map(([p,k])=>`<div class="card ${k=='offers'?'':'s'}"><div class="who">${av(p.profiles)}<div><b>${esc(name(p.profiles))}</b><small>${esc(p.profiles.profession||'')}</small></div><small>${ago(p.created_at)}</small></div><span class="tag">${k=='offers'?'Offre':'Recherche'} · ${esc(p.category)}</span>${imgs(p.images)}<h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><footer><button class="bad sm" onclick="once(this,()=>moder('${k}','${p.id}','rejected'))">${ic('x')}Refuser</button><button class="sm" onclick="once(this,()=>moder('${k}','${p.id}','active'))">${ic('check')}Valider</button></footer></div>`).join('')}</div>`:'<p class="muted">Rien à valider.</p>'}`}
async function payAct(id,ok){const{error}=await sb.rpc(ok?'admin_confirm_payment':'admin_reject_payment',{p_id:id});toast(error?'Action impossible.':ok?'Paiement confirmé, crédits ajoutés.':'Paiement rejeté.');valid()}
async function moder(k,id,st){const{error}=await sb.from(k).update({status:st}).eq('id',id);toast(error?'Action impossible.':st=='active'?'Publication validée.':'Publication refusée.');valid()}
/* ---------- DÉMARRAGE ---------- */
sb.auth.onAuthStateChange((ev,s)=>{const u=s?.user||null;if(ev=='PASSWORD_RECOVERY'){me=u;rec=1;recView();return}if(rec)return;if((u&&u.id)!==(me&&me.id)){me=u;me?start():authView()}});
navigator.serviceWorker?.addEventListener('message',ev=>{const d=ev.data;if(d&&d.type=='notif'&&me&&d.t)openN(d.t,d.id||'')});
sb.auth.getSession().then(({data})=>{if(!data.session)authView()});
</script></body></html>
